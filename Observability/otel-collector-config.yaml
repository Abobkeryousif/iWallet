
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318


exporters:

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    
    traces:
      receivers: [otlp]
      exporters: [otlp/jaeger]

    # metrics:
    #   receivers: [otlp]
    #   exporters: [debug]

    logs:
      receivers: [otlp]
      exporters: [debug]

    