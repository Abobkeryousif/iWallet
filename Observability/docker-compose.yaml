
services:
  iwallet-app:
    build:
      context: ..
      dockerfile: Observability/dockerfile
    container_name: iwallet-application
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__default: "Server=sqlserver,1433;Database=iWalletDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      JWT__Key: ${JWT_KEY}
      JWT__Issuer: ${JWT_ISSUER}
      JWT__Audience: ${JWT_AUDIENCE}
      redis: "redis-db:6379"
    depends_on:
      - sqlserver
      - redis-db
      - otel-collector



  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iwallet-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped


  redis-db:
    image: redis:7-alpine
    container_name: iwallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped



  
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: iwallet-jaeger-traces
    user: "0:0"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: /badger/data/keys
      BADGER_DIRECTORY_VALUE: /badger/data/values
    volumes:
      - ./jaeger-data/data:/badger/data
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped


  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-container
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4319:4317"
      - "4320:4318"
      - "13133:13133"
      - "9464:9464"

    depends_on:
      - jaeger
    restart: unless-stopped


  prometheus:
    image: prom/prometheus
    container_name: iwallet-prometheus-metrics
    ports:
      - 9094:9090
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml 

    depends_on:
      - otel-collector
   
  loki:
    image: grafana/loki
    container_name: iwallet-loki-logs
    command:  -config.file=/etc/loki/config.yaml
    ports:
      - 127.0.0.1:3100:3100

    volumes:
      - ./loki-configs.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

    restart: unless-stopped      

  grafana:
    image: grafana/grafana
    container_name: iwallet-grafana-dashboard

    ports: 
      - "127.0.0.1:3000:3000"
    volumes:  
       - grafana-data:/var/lib/grafana
       - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro

    depends_on:
      - loki
    restart: unless-stopped




volumes:
  sqlserver-data:
  redis-data:
  jaeger-data:
  loki-data:
  grafana-data:

