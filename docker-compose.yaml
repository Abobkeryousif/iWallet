services:
      
  iwallet-app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: iwallet-application
    ports:
      - 8082:8080
    
    environment:
       ConnectionStrings__default: "Server=sqlserver,1433;Database=iWalletDb;User Id=sa;Password=admin123$;TrustServerCertificate=True;"
       JWT__Key: ${JWT_KEY}
       JWT__Issuer: ${JWT_ISSUER}
       JWT__Audience: ${JWT_AUDIENCE}
       redis: "redis-db:6379"

    depends_on:
      - sqlserver
      - redis-db

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iwallet-Database

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      

    ports:
      - 1433:1433
    volumes:
      - sqlserver-data:/var/opt/mssql
  
  redis-db:
    image: redis:7-alpine
    container_name: iwallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

    
